[build]
  functions = "netlify/functions"

[build.environment]
  # Public-facing keys (Supabase anon key, Stripe publishable key) appear in client-side
  # HTML files by design — they are safe to expose. Real secrets (sk_, whsec_, service_role)
  # are stored exclusively in Netlify environment variables, never in code.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Internal files live in the repo but must not be served publicly: plans/notes (docs/),
# database setup scripts (supabase/), the functions' source (netlify/) and the README.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
