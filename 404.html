<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found — My Cabinet Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#0f172a;--accent:#0f766e;--bg:#f8fafc;--muted:#64748b;}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;}
h1{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:900;margin-bottom:12px;}
p{font-size:15px;color:var(--muted);margin-bottom:32px;line-height:1.7;max-width:420px;}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
a{display:inline-block;padding:12px 28px;background:var(--accent);color:#fff;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;}
a:hover{background:#115e59;}
a.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
a.ghost:hover{background:#f0fdfa;}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>We couldn't find that page. It may have moved, or the link may be mistyped.</p>
  <div class="links"><a href="/">Home</a><a class="ghost" href="/app">Open the planner</a></div>
</main>
</body>
</html>
